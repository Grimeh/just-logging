[package]
name = "just-logging"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam-queue = "0.3.11"
log = "0.4.17"
chrono = "0.4.42"

[features]
default = []
backtrace = []

[dependencies.atomic-wait]
git = "https://github.com/Grimeh/atomic-wait"
branch = "shared"

[dependencies.log-panics]
git = "https://github.com/Grimeh/rust-log-panics"
branch = "add_flush"
features = ["with-backtrace", "flush"]
